<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理画面 | 有限会社 一関防災設備</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/admin-DegB52dV.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-C2GBtxY7.js">
  <link rel="modulepreload" crossorigin href="/assets/content-map-QrpzOPgt.js">
  <link rel="stylesheet" crossorigin href="/assets/admin-CCuZvXai.css">
</head>
<body>
<div class="admin-page">

  <!-- ログイン画面 -->
  <div id="adminLogin" style="display:none">
    <div class="admin-login-card">
      <h2>管理画面</h2>
      <p>お知らせ・テキストの編集を行うには<br>ログインしてください。</p>
      <div class="admin-error-msg" id="adminError"></div>
      <div class="admin-field">
        <label for="adminEmail">メールアドレス</label>
        <input type="email" id="adminEmail" placeholder="ibs-planning@ab.auone-net.jp" autocomplete="username">
      </div>
      <div class="admin-field">
        <label for="adminPassword">パスワード</label>
        <input type="password" id="adminPassword" placeholder="パスワード" autocomplete="current-password">
      </div>
      <button class="admin-login-btn" id="adminLoginBtn" onclick="handleLogin()">ログイン</button>
      <a class="admin-back-link" href="/">← サイトに戻る</a>
    </div>
  </div>

  <!-- 管理パネル -->
  <div id="adminPanel" style="display:none">
    <div class="admin-header">
      <h1>管理画面</h1>
      <div class="admin-user-info">
        <span class="admin-user-email" id="adminUserLabel"></span>
        <button class="admin-logout-btn" onclick="handleLogout()">ログアウト</button>
      </div>
    </div>

    <!-- タブナビ -->
    <div class="admin-tabs">
      <button class="admin-tab active" id="tabNews" onclick="switchTab('news')">お知らせ</button>
      <button class="admin-tab" id="tabText" onclick="switchTab('text')">テキスト編集</button>
    </div>

    <!-- ===== お知らせタブ ===== -->
    <div class="admin-tab-content active" id="tabContentNews">
      <!-- 一覧エリア -->
      <div id="newsListArea">
        <div class="admin-section-header">
          <h2>お知らせ一覧</h2>
          <button class="admin-add-btn" onclick="showAddForm()">+ 新規追加</button>
        </div>
        <div id="newsListContainer"></div>
      </div>

      <!-- フォームエリア -->
      <div id="newsFormArea" style="display:none">
        <div class="admin-form-card">
          <h2 id="formTitle">新規お知らせ追加</h2>
          <form id="newsForm" onsubmit="saveNews(event)">
            <input type="hidden" id="newsId">
            <div class="admin-form-row">
              <div class="admin-form-field">
                <label for="newsDate">日付 *</label>
                <input type="date" id="newsDate" required>
              </div>
              <div class="admin-form-field">
                <label for="newsCategory">カテゴリ</label>
                <select id="newsCategory">
                  <option value="お知らせ">お知らせ</option>
                  <option value="採用情報">採用情報</option>
                  <option value="施工・対応事例">施工・対応事例</option>
                  <option value="イベント">イベント</option>
                </select>
              </div>
            </div>
            <div class="admin-form-field">
              <label for="newsHeading">見出し *</label>
              <input type="text" id="newsHeading" required placeholder="お知らせのタイトルを入力">
            </div>
            <div class="admin-form-field">
              <label for="newsBody">本文</label>
              <textarea id="newsBody" placeholder="お知らせの詳細を入力（任意）"></textarea>
            </div>
            <div class="admin-form-field">
              <label for="newsSortOrder">表示順</label>
              <input type="number" id="newsSortOrder" value="0" min="0">
            </div>
            <div class="admin-form-actions">
              <button type="submit" class="admin-save-btn" id="saveNewsBtn">保存</button>
              <button type="button" class="admin-cancel-btn" onclick="cancelForm()">キャンセル</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- ===== テキスト編集タブ ===== -->
    <div class="admin-tab-content" id="tabContentText">
      <div class="admin-section-header">
        <h2>テキスト編集</h2>
      </div>

      <!-- ページ別サブタブ -->
      <div class="text-sub-tabs" id="textSubTabs"></div>

      <!-- テキスト一覧 -->
      <div id="textListContainer" class="text-list-container"></div>

      <!-- テキスト編集フォーム -->
      <div id="textEditArea" style="display:none">
        <div class="admin-form-card">
          <h2 id="textFormTitle">テキスト編集</h2>
          <form id="textForm" onsubmit="saveTextItem(event)">
            <input type="hidden" id="textContentKey">
            <div class="admin-form-field">
              <label>項目名</label>
              <input type="text" id="textLabel" readonly style="background:#f5f5f5">
            </div>
            <div class="admin-form-field">
              <label for="textContent">テキスト内容</label>
              <textarea id="textContent" rows="4" placeholder="編集するテキストを入力"></textarea>
            </div>
            <div class="admin-form-actions">
              <button type="submit" class="admin-save-btn" id="saveTextBtn">保存</button>
              <button type="button" class="admin-cancel-btn" onclick="cancelTextEdit()">キャンセル</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>

</div>
</body>
</html>
